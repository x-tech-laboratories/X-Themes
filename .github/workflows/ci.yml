name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Every theme variant is a flake check, so this builds each one.
      - name: Build every theme package
        run: nix flake check -L
      # Generated stylesheets are committed, so this fails when they no longer match the tokens.
      - name: Halon generated files are current
        run: nix run .#build -- --check
      - name: Halon contrast audit
        run: nix run .#audit
      - name: Halon lint
        run: nix run .#lint
